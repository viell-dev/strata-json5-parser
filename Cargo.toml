[package]
name = "strata-json5-parser"
version = "0.1.0"
edition = "2024"
description = "JSON5 (json5.org) parser for the Strata parser ecosystem"
repository = "https://codeberg.org/Devious-Concepts/strata-json5-parser"
license = "MPL-2.0"
keywords = ["json5", "json", "parser", "strata"]
categories = ["parser-implementations", "parsing"]
rust-version = "1.87.0"
readme = "README.md"

[dependencies]
strata-json-parser = { path = "../json-parser-llm1" }
strata-json5-rules = { path = "../json5-rules-llm1" }
strata-lexer = { path = "../lexer-llm1" }

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

unexpected_cfgs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
must_use_candidate = "allow"
manual_div_ceil = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
cfg_not_test = "warn"
expect_used = "warn"
indexing_slicing = "warn"
module_name_repetitions = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
